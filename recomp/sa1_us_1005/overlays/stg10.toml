# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG10.PRS (Final Egg),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG10.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C916B60
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg10"
title = "Sonic Adventure overlay STG10"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG10.bin"   # decompressed, 2,229,116 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg10_seeds.txt).
extra = [0x0C900000, 0x0C900134, 0x0C9001F8, 0x0C90025C, 0x0C900268, 0x0C90028C, 0x0C9002B0, 0x0C900BA8, 0x0C906674, 0x0C90D83C, 0x0C914D0C]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG10.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C916B60
size = 2229116
sha256 = "68176c73e0d972bc5c5f226deaa44ec3a590850cf631bd63a6613ad9a3b020a1"
