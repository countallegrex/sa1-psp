# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG05.PRS (Red Mountain),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG05.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C913780
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg05"
title = "Sonic Adventure overlay STG05"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG05.bin"   # decompressed, 1,954,534 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg05_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG05.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C913780
size = 1954534
sha256 = "5231b156f0895b252ad51888832c09cf43063281f7fb9e9383e137837e7d3691"
