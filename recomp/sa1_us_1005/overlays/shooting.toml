# Sonic Adventure (USA) v1.005, code overlay SONICADV/SHOOTING.PRS (Sky Chase),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/SHOOTING.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C908CE0
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_shooting"
title = "Sonic Adventure overlay SHOOTING"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/SHOOTING.bin"   # decompressed, 1,916,104 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in shooting_seeds.txt).
extra = [0x0C900000, 0x0C900CD8, 0x0C90133C, 0x0C9019D4, 0x0C901A24, 0x0C901A2C, 0x0C901C26]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/SHOOTING.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C908CE0
size = 1916104
sha256 = "83aef5dc9b3ea44a4fe653bc727af8aa20e7c5fd4bebfd298f95d08e41dab162"
