# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG07.PRS (Lost World),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG07.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C90BFE0
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg07"
title = "Sonic Adventure overlay STG07"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG07.bin"   # decompressed, 1,430,380 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg07_seeds.txt).
extra = [0x0C900000, 0x0C90011A, 0x0C900148, 0x0C9001D8, 0x0C900318, 0x0C901824, 0x0C9019DC, 0x0C9019F0, 0x0C902594, 0x0C903980, 0x0C904500, 0x0C904FA4, 0x0C90568C, 0x0C90A0B4, 0x0C90B4CC, 0x0C90B4F8, 0x0C90A1EC]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG07.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C90BFE0
size = 1430380
sha256 = "3bd82699695745fd199949bd4a40f931a1546cce7a004c085ea9b29eefdfdb43"
