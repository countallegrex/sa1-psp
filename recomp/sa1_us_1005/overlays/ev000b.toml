# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV000B.PRS (event 000B),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV000B.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB878E0
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev000b"
title = "Sonic Adventure overlay EV000B"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV000B.bin"   # decompressed, 383,820 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev000b_seeds.txt).
extra = [0x0CB80020, 0x0CB813E4]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV000B.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB878E0
size = 383820
sha256 = "6c061260e25583638437f00f7cbe09407a447a52f92bd32259a93011357eb3b7"
