# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG02.PRS (Windy Valley),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG02.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C90CDC0
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg02"
title = "Sonic Adventure overlay STG02"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG02.bin"   # decompressed, 1,138,093 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg02_seeds.txt).
extra = [0x0C900000, 0x0C90011A, 0x0C900178, 0x0C900BCC, 0x0C902E10, 0x0C906674, 0x0C900196]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG02.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C90CDC0
size = 1138093
sha256 = "59e1b467567021cee5eb69e02b86bfdb54a94b94d0330419f60a3b56f33deb11"
