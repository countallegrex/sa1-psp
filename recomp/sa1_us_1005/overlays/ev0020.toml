# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV0020.PRS (event 0020),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV0020.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB826E0
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev0020"
title = "Sonic Adventure overlay EV0020"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV0020.bin"   # decompressed, 26,612 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev0020_seeds.txt).
extra = [0x0CB80020, 0x0CB817E0]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV0020.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB826E0
size = 26612
sha256 = "566c83785da0723bbee35d9d48c6fa0c366c8a44822dfabf1af67d4303adaacd"
