# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV001B.PRS (event 001B),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV001B.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB82380
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev001b"
title = "Sonic Adventure overlay EV001B"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV001B.bin"   # decompressed, 154,620 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev001b_seeds.txt).
extra = [0x0CB80020]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV001B.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB82380
size = 154620
sha256 = "2f03f0745da81476bcdeb13c3c4ebe7b4572f7002d6076ef224914bb535342f1"
