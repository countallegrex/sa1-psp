# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADV0100.PRS (Egg Carrier, flying),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the second area slot
# at 0x8C920000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADV0100.bin. Run with
#   DREAM_CODE_RANGES=0C920000:0C92F160
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_adv0100"
title = "Sonic Adventure overlay ADV0100"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADV0100.bin"   # decompressed, 2,160,414 bytes
load_address = 0x8C920000
link_address = 0x0C920000
entry = 0x8C920000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in adv0100_seeds.txt).
extra = [0x0C920000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADV0100.PRS"
slot = 0x8C920000
code_lo = 0x8C920000
code_hi = 0x8C92F160
size = 2160414
sha256 = "ee52af75e4e87374597a4227d2cdae5b136f51d191f21a0bbba0e92fdd8c31c8"
