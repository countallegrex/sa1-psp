# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADV01OBJ.PRS (Egg Carrier objects),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADV01OBJ.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C901460
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_adv01obj"
title = "Sonic Adventure overlay ADV01OBJ"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADV01OBJ.bin"   # decompressed, 6,764 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in adv01obj_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADV01OBJ.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C901460
size = 6764
sha256 = "8c60245dbc05f26858add2515feaf7da0e51934bebe3d8f746dffdc99681c310"
