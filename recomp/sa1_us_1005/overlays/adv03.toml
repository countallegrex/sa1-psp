# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADV03.PRS (the Past),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADV03.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C904F20
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_adv03"
title = "Sonic Adventure overlay ADV03"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADV03.bin"   # decompressed, 1,060,196 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in adv03_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADV03.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C904F20
size = 1060196
sha256 = "ff80d10c55f095f4d22f068bba97bfd1477eb6f9a4be60c1b7e04ac4fe38c6dd"
