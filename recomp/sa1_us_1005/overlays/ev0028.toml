# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV0028.PRS (event 0028),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV0028.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB81E40
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev0028"
title = "Sonic Adventure overlay EV0028"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV0028.bin"   # decompressed, 104,060 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev0028_seeds.txt).
extra = [0x0CB80020]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV0028.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB81E40
size = 104060
sha256 = "66a69a8445a0b0ccb954a06f5277dfdbec67f9bbe011d32253b605cfef72bf08"
