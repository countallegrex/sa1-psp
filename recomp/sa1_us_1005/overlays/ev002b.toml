# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV002B.PRS (opening event),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/extract_overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV002B.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB8A260
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev002b"
title = "Sonic Adventure overlay EV002B"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV002B.bin"   # decompressed, 325,560 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x8CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev002b_seeds.txt).
extra = [0x0CB80020, 0x0CB815FA, 0x0CB83F60]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV002B.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB8A260
size = 325560
sha256 = "24958a1055e9aa83580f6777ba9a4e3675c44e290842f31b86375755853a985e"
