# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV0008.PRS (event 0008),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV0008.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB89C60
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev0008"
title = "Sonic Adventure overlay EV0008"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV0008.bin"   # decompressed, 475,904 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev0008_seeds.txt).
extra = [0x0CB80020, 0x0CB87D64]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV0008.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB89C60
size = 475904
sha256 = "5c89e0541efd1cd9b2e5840c97e7f06eb998ab9416e9ef0a0598a56348ea00ea"
