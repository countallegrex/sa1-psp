# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV002A.PRS (event 002A),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV002A.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB80A00
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev002a"
title = "Sonic Adventure overlay EV002A"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV002A.bin"   # decompressed, 85,856 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev002a_seeds.txt).
extra = [0x0CB80020]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV002A.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB80A00
size = 85856
sha256 = "caeb05a64a0f4c8d83097674a4283488c29be527ddc643e81b6baee7426de465"
