# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV000C.PRS (event 000C),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV000C.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB84BC0
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev000c"
title = "Sonic Adventure overlay EV000C"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV000C.bin"   # decompressed, 169,000 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev000c_seeds.txt).
extra = [0x0CB80020, 0x0CB80E64, 0x0CB813B4, 0x0CB81770]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV000C.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB84BC0
size = 169000
sha256 = "96c3768dc8f8b318ada0e0f4dc24057ed000f27dcfbea3f12c1a45562058523b"
