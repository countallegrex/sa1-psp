# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG06.PRS (Sky Deck),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG06.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C91BB00
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg06"
title = "Sonic Adventure overlay STG06"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG06.bin"   # decompressed, 1,995,960 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg06_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG06.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C91BB00
size = 1995960
sha256 = "b1e44238cab5561e227782fa74cead30bfc45a1d0e31360586b8b8280ed7bbf7"
