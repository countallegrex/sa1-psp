# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV0009.PRS (event 0009),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV0009.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB85100
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev0009"
title = "Sonic Adventure overlay EV0009"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV0009.bin"   # decompressed, 191,104 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev0009_seeds.txt).
extra = [0x0CB80020]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV0009.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB85100
size = 191104
sha256 = "cfc482d56f4f321f93d5fddc718b313ae600a10da549763f93763ba53dbb7abf"
