# Sonic Adventure (USA) v1.005, code overlay SONICADV/B_EGM1.PRS (boss Egg Hornet),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/B_EGM1.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C904B60
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_b_egm1"
title = "Sonic Adventure overlay B_EGM1"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/B_EGM1.bin"   # decompressed, 421,244 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in b_egm1_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/B_EGM1.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C904B60
size = 421244
sha256 = "cf4fd00cca51851a6b06ab0f3fa0850ef19a843b8791e8bdb49a77e35de5ed60"
