# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADVERTISE.PRS (title screen and menus),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/extract_overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADVERTISE.bin. Run with
#   DREAM_CODE_RANGES=0C900020:0C90EB00
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_advertise"
title = "Sonic Adventure overlay ADVERTISE"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADVERTISE.bin"   # decompressed, 937,008 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in advertise_seeds.txt).
extra = [0x0C9000F4, 0x0C9001C0, 0x0C9001DA, 0x0C900840, 0x0C90179A, 0x0C90699A, 0x0C90B7B0, 0x0C90120C, 0x0C901A4C, 0x0C9055A0, 0x0C909DA0, 0x0C90B4CC]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADVERTISE.PRS"
slot = 0x8C900000
code_lo = 0x8C900020
code_hi = 0x8C90EB00
size = 937008
sha256 = "49e2690ab09d2802a4e0a284526a8ace18306722973fbb2ded663ad95fff4c39"
