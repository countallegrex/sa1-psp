# Sonic Adventure (USA) v1.005, code overlay SONICADV/STG09.PRS (Casinopolis),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/STG09.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C923DA0
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_stg09"
title = "Sonic Adventure overlay STG09"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/STG09.bin"   # decompressed, 2,242,852 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in stg09_seeds.txt).
extra = [0x0C900000, 0x0C90007A, 0x0C900128, 0x0C9004B6, 0x0C9004D4, 0x0C9016C4, 0x0C902E58, 0x0C90F274, 0x0C910E74, 0x0C913390, 0x0C919178, 0x0C90116C]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/STG09.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C923DA0
size = 2242852
sha256 = "a519225e97f4c46b3538d4f172d3afe55c83e0059960e96b1ca5977b260d9119"
