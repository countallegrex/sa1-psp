# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV0029.PRS (event 0029),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV0029.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB85620
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev0029"
title = "Sonic Adventure overlay EV0029"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV0029.bin"   # decompressed, 92,420 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev0029_seeds.txt).
extra = [0x0CB80020, 0x0CB80740]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV0029.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB85620
size = 92420
sha256 = "58648e981906308f80475b7695c95d7acb1d266d5f6896713800c856139785f5"
