# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADV02.PRS (Mystic Ruins),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the area slot
# at 0x8C900000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADV02.bin. Run with
#   DREAM_CODE_RANGES=0C900000:0C915E60
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_adv02"
title = "Sonic Adventure overlay ADV02"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADV02.bin"   # decompressed, 2,355,272 bytes
load_address = 0x8C900000
link_address = 0x0C900000
entry = 0x8C900000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in adv02_seeds.txt).
extra = [0x0C900000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADV02.PRS"
slot = 0x8C900000
code_lo = 0x8C900000
code_hi = 0x8C915E60
size = 2355272
sha256 = "3a4f70b1557d629168de893ea025f07bdb3e18cdd69892c5daac1f5d67bc36d4"
