# Sonic Adventure (USA) v1.005, code overlay SONICADV/ADV0130.PRS (Egg Carrier, sunk),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the second area slot
# at 0x8C920000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/ADV0130.bin. Run with
#   DREAM_CODE_RANGES=0C920000:0C92B620
# (the code part; data follows it). See docs/m1-overlays.md.

[game]
id = "sa1_ovl_adv0130"
title = "Sonic Adventure overlay ADV0130"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/ADV0130.bin"   # decompressed, 1,034,516 bytes
load_address = 0x8C920000
link_address = 0x0C920000
entry = 0x8C920000

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in adv0130_seeds.txt).
extra = [0x0C920000]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/ADV0130.PRS"
slot = 0x8C920000
code_lo = 0x8C920000
code_hi = 0x8C92B620
size = 1034516
sha256 = "497b1646a82ea9276a89bbf4697ecc0544fc0e3715257c7bd0bbc6182855d9d9"
