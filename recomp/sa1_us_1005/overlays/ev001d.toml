# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV001D.PRS (event 001D),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV001D.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB83420
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev001d"
title = "Sonic Adventure overlay EV001D"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV001D.bin"   # decompressed, 68,884 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB80020

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev001d_seeds.txt).
extra = [0x0CB80020]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV001D.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB83420
size = 68884
sha256 = "7575e162b6d9c48f5a1bb17c5d2a9afeafbf931de4a4bed6c9f0dbc4861a235e"
