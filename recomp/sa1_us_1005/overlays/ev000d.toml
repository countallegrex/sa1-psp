# Sonic Adventure (USA) v1.005, code overlay SONICADV/EV000D.PRS (event 000D),
# for dream-translate (discovery only). Addresses only; nothing from the disc
# is in this file. The game decompresses the file (SEGA PRS) to the event slot
# at 0x8CB80000; tools/overlays.py writes the same bytes to
# ../private/overlays/sa1_us_1005/EV000D.bin. Run with
#   DREAM_CODE_RANGES=0CB80020:0CB82420
# (the code part; data follows it). See docs/m1-overlays.md.
# The file starts with a 32-byte header of entry pointers; code starts at +0x20.

[game]
id = "sa1_ovl_ev000d"
title = "Sonic Adventure overlay EV000D"
region = "USA"

[binary]
path = "../../../../private/overlays/sa1_us_1005/EV000D.bin"   # decompressed, 87,600 bytes
load_address = 0x8CB80000
link_address = 0x0CB80000
entry = 0x0CB8004A

[functions]
pointers = true
sweep = true
# Header entry pointers, then executed call targets discovery missed
# (tools/trace_diff.py --overlay; also in ev000d_seeds.txt).
extra = [0x0CB8004A]
exclude = []

# Read by recomp/emitter/emit_overlay.py and tools/extract_overlays.py;
# dream-translate ignores this table.
[sa1_overlay]
file = "SONICADV/EV000D.PRS"
slot = 0x8CB80000
code_lo = 0x8CB80020
code_hi = 0x8CB82420
size = 87600
sha256 = "abcac897cdb3934c0c372cd53f4fe5d5717e149a58950716bab78a04aef77b34"
