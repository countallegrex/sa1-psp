name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fails the build if anything game-derived is tracked. Needs no game data.
  check-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_clean.py --all
      # hle/overlay/overlay_registry.c must match recomp/sa1_us_1005/overlays/*.toml
      - run: python3 tools/gen_overlay_registry.py --check

  # PSP target inside the pinned pspdev image (same pin as the Dockerfile and
  # docs/m-1-toolchain.md).
  psp:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:v20261001@sha256:54895e6f5afb71b8f4f6915ee6d5023e1e087ca7afdf2dcb1d7a694a5233e45f
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/build_psp.sh build-ci-psp
      - uses: actions/upload-artifact@v7
        with:
          name: EBOOT-psp
          path: build-ci-psp/EBOOT.PBP
          if-no-files-found: error

  # Keeps the Dockerfile honest: the command docs/m-1-toolchain.md gives.
  psp-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --output build-ci-psp .
      - run: test -f build-ci-psp/EBOOT.PBP

  # SH-4 -> C emitter: hand-written snippets assembled, recompiled, compiled
  # with the host compiler and executed.  Needs no game data.
  emitter-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/emitter/run_tests.py
      # Overlay loader slot rules (tests/overlay/loader_test.c), no game data.
      - name: Overlay loader test
        shell: bash
        run: |
          ${{ matrix.os == 'windows-latest' && 'clang' || 'cc' }} -std=c11 -D_CRT_SECURE_NO_WARNINGS \
            -Ihle -Ihle/overlay -Irecomp/emitter/runtime tests/overlay/loader_test.c \
            hle/overlay/overlay_loader.c hle/state.c recomp/emitter/runtime/sh4_rt.c -o loader_test
          ./loader_test
      # PVR texture decoder on synthetic textures (tests/ninja/pvr_decode_test.c), no game data.
      - name: PVR decoder test
        shell: bash
        run: |
          ${{ matrix.os == 'windows-latest' && 'clang' || 'cc' }} -std=c11 -Wall -D_CRT_SECURE_NO_WARNINGS             -Ihle/ninja tests/ninja/pvr_decode_test.c hle/ninja/pvr_decode.c -o pvr_decode_test
          ./pvr_decode_test

  # Replay harness on synthetic data (tests/replay/README.md): tape format
  # round trip through backend/desktop/input_tape.c and tools/tape_io.py,
  # tools/tape_expect.py, the check evaluation, and tools/replay_test.py's
  # skip path.  Needs no game data.
  replay-harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the tape test
        shell: bash
        run: |
          ${{ matrix.os == 'windows-latest' && 'clang' || 'cc' }} -std=c11 -Wall -D_CRT_SECURE_NO_WARNINGS \
            -Ihle -Irecomp/emitter/runtime -Ibackend/desktop tests/replay/tape_format_test.c \
            backend/desktop/input_tape.c backend/desktop/sha256.c recomp/emitter/runtime/sh4_rt.c \
            ${{ matrix.os == 'windows-latest' && ' ' || '-lm' }} -o tape_format_test
      - run: python tests/replay/run_synthetic.py ./tape_format_test

  # Save states on synthetic data (docs/savestate.md section 5): the
  # fixed-address coroutines, the chunk writer, the byte-run packer and the
  # build check, in two processes.  Linked without ASLR like sa1psp.
  savestate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the save-state test
        shell: bash
        run: |
          ${{ matrix.os == 'windows-latest' && 'clang' || 'cc' }} -std=c11 -Wall -D_CRT_SECURE_NO_WARNINGS \
            -Ihle -Irecomp/emitter/runtime -Ibackend -Ibackend/desktop tests/savestate/savestate_test.c \
            backend/desktop/platform_desktop.c backend/desktop/coro_switch.c backend/desktop/savestate.c \
            backend/desktop/sha256.c hle/state.c recomp/emitter/runtime/sh4_rt.c \
            ${{ matrix.os == 'windows-latest' && '-Xlinker /DYNAMICBASE:NO' || '-no-pie -lm' }} -o savestate_test
      - run: python tests/savestate/run_synthetic.py ./savestate_test

  # Desktop target with clang + Ninja, then run the hello-world.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version
          clang --version
      - name: Configure
        run: cmake -S . -B build-ci-desktop -G Ninja -DTARGET=desktop -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-ci-desktop
      - name: Run hello-world
        shell: pwsh
        run: |
          $out = & build-ci-desktop\backend\desktop\sa1psp_hello.exe
          if ($LASTEXITCODE -ne 0) { throw "hello exited $LASTEXITCODE" }
          $out
          if (-not ($out -match 'hello from the desktop backend')) { throw "unexpected output" }
