name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fails the build if anything game-derived is tracked. Needs no game data.
  check-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_clean.py --all

  # PSP target inside the pinned pspdev image (same pin as the Dockerfile and
  # docs/m-1-toolchain.md).
  psp:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:v20261001@sha256:54895e6f5afb71b8f4f6915ee6d5023e1e087ca7afdf2dcb1d7a694a5233e45f
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/build_psp.sh build-ci-psp
      - uses: actions/upload-artifact@v7
        with:
          name: EBOOT-psp
          path: build-ci-psp/EBOOT.PBP
          if-no-files-found: error

  # Keeps the Dockerfile honest: the command docs/m-1-toolchain.md gives.
  psp-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --output build-ci-psp .
      - run: test -f build-ci-psp/EBOOT.PBP

  # Desktop target with clang + Ninja, then run the hello-world.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version
          clang --version
      - name: Configure
        run: cmake -S . -B build-ci-desktop -G Ninja -DTARGET=desktop -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-ci-desktop
      - name: Run hello-world
        shell: pwsh
        run: |
          $out = & build-ci-desktop\backend\desktop\sa1psp_hello.exe
          if ($LASTEXITCODE -ne 0) { throw "hello exited $LASTEXITCODE" }
          $out
          if (-not ($out -match 'hello from the desktop backend')) { throw "unexpected output" }
